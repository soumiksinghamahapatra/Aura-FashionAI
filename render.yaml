services:
  - type: web
    name: aura-stylist
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/database.sqlite
    disk:
      name: aura-data
      mountPath: /var/data
      sizeGB: 5
